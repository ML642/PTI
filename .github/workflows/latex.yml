name: Compile LaTeX

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Compile raport 3
      uses: xu-cheng/latex-action@v2
      with:
        root_file: raport_3/raport_3.tex
        work_in_root_file_dir: true

    - name: Upload PDF
      uses: actions/upload-artifact@v4
      with:
        name: raport_3_pdf
        path: raport_3/raport_3.pdf